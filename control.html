<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ルームチャット</title>
    <link rel="stylesheet" href="control.css">
  </head>
  <body>
    <main>
      <h1>ルームチャット</h1>
      <section class="skip-automation" aria-label="メッセージ自動削除">
        <button id="auto-delete-toggle" type="button" aria-pressed="false">メッセージ自動削除 OFF</button>
        <output id="skip-status" role="status">OFF</output>
      </section>
      <details class="setup-section">
        <summary>キャラクター情報と番号割り当て</summary>
        <button id="acquire" type="button">キャラ情報を取得</button>
        <div id="characters" aria-label="キャラクター番号割り当て"></div>
        <output id="status" role="status">キャラ情報を取得してください。</output>
        <small>番号は1〜9です。例: 1s-10、2h20、8m=10、1234s-10</small>
      </details>

      <section class="chat-section" aria-label="ルームチャット">
        <ol id="chat-log" aria-live="polite"></ol>
        <div class="chat-toolbar">
          <select id="chat-tabs" class="chat-tabs" aria-label="チャットタブ"></select>
          <button id="refresh-chat" type="button" aria-label="チャットを更新">更新</button>
        </div>
        <div class="speaker-row">
          <img id="speaker-avatar" class="speaker-avatar" alt="">
          <label for="speaker-name">発言名</label>
          <input id="speaker-name" type="text" placeholder="発言名">
          <label for="character-choice">キャラクター</label>
          <select id="character-choice"><option value="">選択なし</option></select>
        </div>
        <div class="dice-toolbar">
          <div id="dice-shortcuts" class="dice-shortcuts" aria-label="ダイスショートカット"></div>
          <div id="dice-count" class="dice-count" role="tablist" aria-label="ダイス個数"></div>
        </div>
        <div class="message-composer">
          <textarea id="chat-input" rows="3" placeholder="メッセージを入力" aria-label="メッセージを入力"></textarea>
          <button id="clear-message" type="button">クリア</button>
          <button id="send-message" type="button">送信</button>
        </div>
        <output id="chat-status" role="status"></output>
      </section>
    </main>
    <script src="control.js"></script>
  </body>
</html>
