<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ルームチャット</title>
    <link rel="stylesheet" href="control.css">
  </head>
  <body>
    <main>
      <header class="window-header">
        <h1>ルームチャット</h1>
        <button id="toggle-settings" type="button" aria-expanded="false" aria-label="設定・キャラクター情報を開閉" title="設定・キャラクター情報">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </header>
      <details class="setup-section">
        <summary>
          <button id="close-room-chat" type="button" aria-label="ルームチャットを閉じる" title="ルームチャットを閉じる">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1 8 6 2 11z"/><path d="M10 1v10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <span class="setup-title">設定・キャラクター情報</span>
        </summary>
        <section class="theme-section" aria-label="テーマ・フォント">
          <div class="theme-setting-row theme-choice-row">
            <label for="theme-select">テーマ</label>
            <select id="theme-select">
              <option value="dark">Dark</option>
              <option value="original">Original</option>
            </select>
          </div>
          <div class="theme-setting-row font-choice-row">
            <label for="font-select">フォント</label>
            <select id="font-select">
              <option value="default">デフォルト</option>
              <option value="NotoSansCJK-Regular">NotoSansCJK-Regular</option>
              <option value="JetBrainsMonoNF-Regular">JetBrainsMonoNF-Regular</option>
              <option value="しねきゃぷしょん">しねきゃぷしょん</option>
            </select>
          </div>
          <div class="theme-setting-row font-size-row">
            <label for="font-size-select">サイズ</label>
            <select id="font-size-select">
              <option value="10">10px</option>
              <option value="11">11px</option>
              <option value="12">12px</option>
              <option value="13" selected>13px</option>
              <option value="14">14px</option>
              <option value="15">15px</option>
              <option value="16">16px</option>
              <option value="17">17px</option>
              <option value="18">18px</option>
              <option value="19">19px</option>
              <option value="20">20px</option>
              <option value="21">21px</option>
              <option value="22">22px</option>
              <option value="23">23px</option>
              <option value="24">24px</option>
            </select>
          </div>
        </section>
        <section class="skip-automation" aria-label="メッセージ自動削除">
          <label for="auto-skip-interval">削除までの待ち時間（秒）</label>
          <input id="auto-skip-interval" type="number" min="0.1" max="3600" step="0.1" value="1">
          <button id="auto-delete-toggle" type="button" aria-pressed="false">OFF</button>
          <output id="skip-status" role="status">メッセージ自動削除OFF（通常動作）</output>
        </section>
        <h2>キャラクター情報と番号割り当て</h2>
        <div id="characters" aria-label="キャラクター番号割り当て"></div>
        <output id="status" role="status">キャラ情報未取得</output>
        <section class="alias-settings" aria-label="エイリアス設定">
          <div class="alias-editor">
            <strong>エイリアス（alias）</strong>
            <button id="alias-buttons-toggle" type="button" aria-pressed="false">ボタン列：非表示</button>
          </div>
          <div class="alias-editor">
            <label for="alias-name">alias名</label>
            <input id="alias-name" type="text" placeholder="alias名" maxlength="20">
            <button id="alias-add" type="button">追加</button>
            <button id="alias-cancel" type="button" hidden>やめる</button>
          </div>
          <textarea id="alias-text" rows="3" placeholder=";で発言を区切る（#delay 0.8;で次の発言まで0.8秒待機）"></textarea>
          <ul id="alias-list" class="alias-list" aria-label="登録済みエイリアス"></ul>
          <output id="alias-status" role="status"></output>
        </section>
        <section class="alias-settings" aria-label="設定のバックアップ">
          <div class="alias-editor">
            <strong>設定のバックアップ</strong>
            <button id="settings-export" type="button">書き出す</button>
            <button id="settings-import" type="button">読み込む</button>
          </div>
          <textarea id="settings-io-json" rows="3" placeholder="「書き出す」で設定がここに出ます。コピーして保管してください。読み込むときは貼り付けて「読み込む」を押します。"></textarea>
        </section>
      </details>

      <section class="chat-section" aria-label="ルームチャット">
        <div class="log-search-row">
          <input id="log-search" type="search" placeholder="ログを検索（発言者・本文）">
          <output id="log-search-count" aria-live="polite"></output>
        </div>
        <ol id="chat-log" aria-live="polite"></ol>
        <div class="chat-toolbar">
          <div id="chat-tabs" class="chat-tabs" role="tablist" aria-label="チャットタブ"></div>
          <button id="refresh-scan" type="button" aria-label="キャラ情報・パレット・シーンを更新">更新</button>
        </div>
        <div class="speaker-row">
          <img id="speaker-avatar" class="speaker-avatar" alt="">
          <select id="character-choice"></select>
          <button id="open-chat-palette" type="button" aria-label="チャットパレットを開く" title="チャットパレットを開く" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h15v13h-15z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 9h9M7.5 12h9M7.5 15h5.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
        <section id="chat-palette-panel" class="chat-palette-panel" aria-label="チャットパレット" hidden>
          <div class="chat-palette-toolbar">
            <strong>技能値パレット</strong>
          </div>
          <ul id="chat-palette-items" class="chat-palette-items"></ul>
          <div class="chat-palette-footer">
            <button id="refresh-chat-palette" type="button" aria-label="チャットパレットを更新">更新</button>
            <button id="close-chat-palette" type="button" aria-label="パレットを閉じる">閉じる</button>
          </div>
          <output id="chat-palette-status" role="status"></output>
        </section>
        <div id="dice-shortcuts" class="dice-shortcuts" aria-label="ダイスショートカット"></div>
        <div id="alias-buttons" class="alias-buttons" aria-label="エイリアスボタン"></div>
        <div class="message-composer">
          <textarea id="chat-input" rows="3" placeholder="メッセージを入力" aria-label="メッセージを入力"></textarea>
          <div id="skill-suggestions" class="skill-suggestions" hidden role="listbox" aria-label="技能候補"></div>
          <div id="command-suggestions" class="skill-suggestions" hidden role="listbox" aria-label="コマンド候補"></div>
          <button id="clear-message" type="button">クリア</button>
          <button id="send-message" type="button">送信</button>
        </div>
        <div class="composer-speaker" id="composer-speaker">
          <img id="composer-speaker-avatar" class="composer-speaker-avatar" alt="">
          <span id="composer-speaker-name"></span>
        </div>
        <output id="chat-status" role="status"></output>
      </section>
    </main>
    <script src="control.js"></script>
  </body>
</html>
