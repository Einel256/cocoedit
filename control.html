<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CCFOLIA 全員HP減少</title>
    <link rel="stylesheet" href="control.css">
  </head>
  <body>
    <main>
      <h1>CCFOLIA 全員HP減少</h1>
      <p>開いているCCFOLIAルームの盤面キャラクターを対象にします。</p>
      <label for="amount">減少値</label>
      <input id="amount" type="number" min="1" step="1" value="1">
      <button id="run" type="button">実行</button>
      <output id="status" role="status">待機中</output>
      <small>HPラベルを正確に確認できない場合は安全のため停止します。</small>
    </main>
    <script src="control.js"></script>
  </body>
</html>
